<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%9F%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script src="eventform.js" defer></script>
    <title>Event Ticket</title>
</head>
<body>
  <div class="card">
    <h1>Event Ticket</h1>
    <form id="ticket-form" novalidate>
      <div class="field">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="first-name" required>
      </div>
      <div class="field">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="last-name" required>
      </div>
      <div class="field full">
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>
      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type">
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>
      <div class="field">
        <label for="event-date">Event Date</label>
        <input type="date" id="event-date" name="event-date">
      </div>
      <div class="field full" id="extra-field" hidden>
        <label for="extra-input" id="extra-label"></label>
        <input type="text" id="extra-input" name="extra-input" autocomplete="off">
      </div>
      <button type="submit" class="full">Create Ticket</button>
    </form>
    <div id="errors" class="errors" role="alert" aria-live="assertive" hidden></div>
    <div id="ticket" class="ticket" aria-live="polite" hidden></div>
  </div>
</body>
</html>
